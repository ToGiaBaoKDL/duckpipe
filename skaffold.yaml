apiVersion: skaffold/v4beta11
kind: Config
metadata:
  name: duckpipe

build:
  # Tự động sinh tag theo mã băm nội dung source code
  tagPolicy:
    inputDigest: {}
  local:
    useDockerCLI: true
    useBuildkit: true
    # Tự động push lên K3d Local Container Registry (localhost:5001)
    push: true
    concurrency: 1

profiles:
  # 0. Profile CATALOG: Triển khai Project Nessie Iceberg REST Catalog
  - name: catalog
    manifests:
      rawYaml:
        - infra/catalog/00-nessie.yaml

  # 0.1 Profile SERVING: Triển khai ClickHouse Query Engine
  - name: serving
    manifests:
      rawYaml:
        - infra/serving/01-clickhouse-secret.yaml
        - infra/serving/00-clickhouse.yaml

  # 1. Profile INGEST: Chỉ build và kích hoạt tầng Ingestion
  - name: ingest
    build:
      tagPolicy:
        inputDigest: {}
      local:
        useDockerCLI: true
        useBuildkit: true
        push: true
        concurrency: 1
      artifacts:
        - image: localhost:5001/duckpipe-ingest
          context: src/ingestion
          docker:
            dockerfile: Dockerfile
          hooks:
            after:
              - command:
                  - sh
                  - -c
                  - docker tag "$SKAFFOLD_IMAGE" "$SKAFFOLD_IMAGE_REPO:latest" && docker push "$SKAFFOLD_IMAGE_REPO:latest"
                os: [linux, darwin]
    manifests:
      rawYaml:
        - infra/ingestion/00-job-ingest.yaml

  # 2. Profile DBT: Chỉ build và kích hoạt tầng Transformation (dbt)
  - name: dbt
    build:
      tagPolicy:
        inputDigest: {}
      local:
        useDockerCLI: true
        useBuildkit: true
        push: true
        concurrency: 1
      artifacts:
        - image: localhost:5001/duckpipe-dbt
          context: src/transformation
          docker:
            dockerfile: Dockerfile
          hooks:
            after:
              - command:
                  - sh
                  - -c
                  - docker tag "$SKAFFOLD_IMAGE" "$SKAFFOLD_IMAGE_REPO:latest" && docker push "$SKAFFOLD_IMAGE_REPO:latest"
                os: [linux, darwin]
    manifests:
      rawYaml:
        - infra/transformation/00-job-dbt.yaml

  # 3. Profile ORCHESTRATION: Triển khai Apache Airflow 3 + Kustomize Config/DAGs
  - name: orchestration
    build:
      tagPolicy:
        inputDigest: {}
      local:
        useDockerCLI: true
        useBuildkit: true
        push: true
        concurrency: 1
      artifacts:
        - image: localhost:5001/duckpipe-airflow
          context: src/orchestration
          docker:
            dockerfile: Dockerfile
    manifests:
      kustomize:
        paths:
          - infra/orchestration
          - src/orchestration/dags

  # 3.1 Profile DAGS: Chỉ đồng bộ mã nguồn DAG qua Kustomize (không rebuild image, không restart Pod)
  - name: dags
    manifests:
      kustomize:
        paths:
          - src/orchestration/dags

  # 4. Profile ALL: Khởi tạo đầy đủ toàn bộ Lakehouse Platform
  - name: all
    build:
      tagPolicy:
        inputDigest: {}
      local:
        useDockerCLI: true
        useBuildkit: true
        push: true
        concurrency: 1
      artifacts:
        - image: localhost:5001/duckpipe-ingest
          context: src/ingestion
          docker:
            dockerfile: Dockerfile
          hooks:
            after:
              - command:
                  - sh
                  - -c
                  - docker tag "$SKAFFOLD_IMAGE" "$SKAFFOLD_IMAGE_REPO:latest" && docker push "$SKAFFOLD_IMAGE_REPO:latest"
                os: [linux, darwin]
        - image: localhost:5001/duckpipe-dbt
          context: src/transformation
          docker:
            dockerfile: Dockerfile
          hooks:
            after:
              - command:
                  - sh
                  - -c
                  - docker tag "$SKAFFOLD_IMAGE" "$SKAFFOLD_IMAGE_REPO:latest" && docker push "$SKAFFOLD_IMAGE_REPO:latest"
                os: [linux, darwin]
        - image: localhost:5001/duckpipe-airflow
          context: src/orchestration
          docker:
            dockerfile: Dockerfile
    manifests:
      rawYaml:
        - infra/base/00-namespace.yaml
        - infra/base/01-configmap-aws.yaml
        - infra/base/02-coredns-custom.yaml
        - infra/catalog/00-nessie.yaml
        - infra/serving/01-clickhouse-secret.yaml
        - infra/serving/00-clickhouse.yaml
      kustomize:
        paths:
          - infra/orchestration
          - src/orchestration/dags
