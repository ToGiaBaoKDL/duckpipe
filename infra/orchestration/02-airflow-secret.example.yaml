# Template cấu hình Secret cho Apache Airflow 3 (an toàn để commit lên Git)
# Cách sử dụng:
#   1. cp 02-airflow-secret.example.yaml 02-airflow-secret.yaml
#   2. Thay các giá trị <...> bằng chuỗi ngẫu nhiên:
#      - FERNET_KEY: python3 -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
#      - SECRET_KEY & JWT_SECRET: openssl rand -hex 32
#      - Passwords: openssl rand -base64 18
apiVersion: v1
kind: Secret
metadata:
  name: airflow-secrets
  namespace: duckpipe
  labels:
    app.kubernetes.io/name: airflow
    app.kubernetes.io/component: orchestration
    app.kubernetes.io/part-of: duckpipe
type: Opaque
stringData:
  POSTGRES_DB: "airflow"
  POSTGRES_USER: "airflow"
  POSTGRES_PASSWORD: "<CHANGE_ME_POSTGRES_PASSWORD>"
  AIRFLOW_ADMIN_PASSWORD: "<CHANGE_ME_ADMIN_PASSWORD>"
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: "postgresql+psycopg2://airflow:<CHANGE_ME_POSTGRES_PASSWORD>@airflow-postgres:5432/airflow"
  AIRFLOW__CORE__FERNET_KEY: "<CHANGE_ME_32_BYTE_URLSAFE_BASE64_KEY>"
  AIRFLOW__API__SECRET_KEY: "<CHANGE_ME_HEX_32_BYTES>"
  AIRFLOW__API_AUTH__JWT_SECRET: "<CHANGE_ME_HEX_32_BYTES>"
  # Kết nối tới ClickHouse Serving (khớp với CLICKHOUSE_USER/CLICKHOUSE_PASSWORD ở infra/serving)
  AIRFLOW_CONN_CLICKHOUSE_DEFAULT: "http://default:<CHANGE_ME_CLICKHOUSE_PASSWORD>@clickhouse:8123"
