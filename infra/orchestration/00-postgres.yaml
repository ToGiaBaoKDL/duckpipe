apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: airflow-postgres-storage
  namespace: duckpipe
  labels:
    app.kubernetes.io/name: airflow-postgres
    app.kubernetes.io/component: orchestration-db
    app.kubernetes.io/part-of: duckpipe
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: airflow-postgres
  namespace: duckpipe
  labels:
    app: airflow-postgres
    app.kubernetes.io/name: airflow-postgres
    app.kubernetes.io/component: orchestration-db
    app.kubernetes.io/part-of: duckpipe
spec:
  replicas: 1
  selector:
    matchLabels:
      app: airflow-postgres
  template:
    metadata:
      labels:
        app: airflow-postgres
        app.kubernetes.io/name: airflow-postgres
        app.kubernetes.io/component: orchestration-db
        app.kubernetes.io/part-of: duckpipe
    spec:
      nodeSelector:
        workload: serving
      containers:
        - name: postgres
          image: postgres:17-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: airflow-secrets
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: airflow-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: airflow-secrets
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: "/var/lib/postgresql/data/pgdata"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: airflow-postgres-storage
---
apiVersion: v1
kind: Service
metadata:
  name: airflow-postgres
  namespace: duckpipe
  labels:
    app: airflow-postgres
    app.kubernetes.io/name: airflow-postgres
    app.kubernetes.io/component: orchestration-db
    app.kubernetes.io/part-of: duckpipe
spec:
  selector:
    app: airflow-postgres
  ports:
    - name: postgres
      protocol: TCP
      port: 5432
      targetPort: 5432
