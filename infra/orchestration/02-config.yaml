apiVersion: v1
kind: ConfigMap
metadata:
  name: airflow-common-env
  namespace: duckpipe
  labels:
    app.kubernetes.io/name: airflow
    app.kubernetes.io/component: orchestration
    app.kubernetes.io/part-of: duckpipe
data:
  # Core & Executor
  AIRFLOW__CORE__EXECUTOR: "LocalExecutor"
  AIRFLOW__CORE__LOAD_EXAMPLES: "False"
  AIRFLOW__CORE__LOAD_DEFAULT_CONNECTIONS: "False"
  AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "False"
  AIRFLOW__CORE__DEFAULT_TIMEZONE: "UTC"

  # Auth Manager (Airflow 3 SimpleAuthManager; production lớn nên đổi sang FabAuthManager/OIDC)
  AIRFLOW__CORE__AUTH_MANAGER: "airflow.api_fastapi.auth.managers.simple.simple_auth_manager.SimpleAuthManager"
  AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: "admin:admin"
  AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: "/opt/airflow/auth/passwords.json"

  # Airflow 3 Execution API (dùng loopback trong single-pod; đổi thành http://airflow:8080/execution/ nếu tách Deployment)
  AIRFLOW__CORE__EXECUTION_API_SERVER_URL: "http://127.0.0.1:8080/execution/"

  # DAG Bundles (FolderDagBundle / LocalDagBundle)
  AIRFLOW__DAG_PROCESSOR__DAG_BUNDLE_CONFIG_LIST: "file:///opt/airflow/config/dag_bundles.json"

  # Runtime Variables cho DAG (tránh hardcode image/URL trong code Python)
  AIRFLOW_VAR_DUCKPIPE_INGEST_IMAGE: "localhost:5001/duckpipe-ingest:latest"
  AIRFLOW_VAR_DUCKPIPE_DBT_IMAGE: "localhost:5001/duckpipe-dbt:latest"
  AIRFLOW_VAR_K8S_POD_IMAGE_PULL_POLICY: "Always"
  AIRFLOW_VAR_NESSIE_HEALTH_URL: "http://nessie:19120/api/v1/config"
  AIRFLOW_VAR_CLICKHOUSE_HTTP_URL: "http://clickhouse:8123"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: airflow-config
  namespace: duckpipe
  labels:
    app.kubernetes.io/name: airflow
    app.kubernetes.io/component: orchestration
    app.kubernetes.io/part-of: duckpipe
data:
  # Cấu hình DAG Bundles theo chuẩn Airflow 3 (chuyển sang GitDagBundle khi có Git repo)
  dag_bundles.json: |
    [
      {
        "name": "duckpipe_lakehouse",
        "classpath": "airflow.dag_processing.bundles.local.LocalDagBundle",
        "kwargs": {
          "path": "/opt/airflow/dags"
        }
      }
    ]
