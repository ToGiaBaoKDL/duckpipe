# Template cấu hình Secret cho ClickHouse Server (an toàn để commit lên Git)
# Cách sử dụng:
#   1. cp 01-clickhouse-secret.example.yaml 01-clickhouse-secret.yaml
#   2. Thay mật khẩu bằng chuỗi ngẫu nhiên: openssl rand -base64 18
#   3. Đồng bộ mật khẩu tương ứng vào AIRFLOW_CONN_CLICKHOUSE_DEFAULT trong 02-airflow-secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: clickhouse-secrets
  namespace: duckpipe
  labels:
    app.kubernetes.io/name: clickhouse
    app.kubernetes.io/component: serving
    app.kubernetes.io/part-of: duckpipe
type: Opaque
stringData:
  CLICKHOUSE_USER: "default"
  CLICKHOUSE_PASSWORD: "<CHANGE_ME_CLICKHOUSE_PASSWORD>"
