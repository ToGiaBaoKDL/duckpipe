apiVersion: batch/v1
kind: Job
metadata:
  name: duckpipe-transformation-job
  namespace: duckpipe
  labels:
    app.kubernetes.io/name: duckpipe-transformation
    app.kubernetes.io/component: transformation
    app.kubernetes.io/part-of: duckpipe
spec:
  backoffLimit: 2
  
  # Tự động dọn dẹp xóa cả Job và Pod sau khi hoàn thành 5 phút (300 giây)
  ttlSecondsAfterFinished: 300
  
  template:
    metadata:
      labels:
        app.kubernetes.io/name: duckpipe-transformation
        app.kubernetes.io/component: transformation
        app.kubernetes.io/part-of: duckpipe
    spec:
      nodeSelector:
        workload: batch
      restartPolicy: OnFailure
      
      containers:
        - name: dbt-duckdb
          image: localhost:5001/duckpipe-dbt
          imagePullPolicy: IfNotPresent
          
          # Tự động nạp cấu hình S3 Bucket, Region và AWS Credentials
          envFrom:
            - configMapRef:
                name: aws-config
            - secretRef:
                name: aws-credentials
          env:
            - name: NESSIE_ENDPOINT
              value: "http://nessie:19120/iceberg"
            - name: DBT_SEND_ANONYMOUS_USAGE_STATS
              value: "false"
            - name: DO_NOT_TRACK
              value: "1"
                
          # Giới hạn tài nguyên Pod: RAM limit 512Mi (DuckDB được cấu hình ăn tối đa 350MB)
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
              
          # Gắn volume tạm vào /tmp/duckdb_scratch để DuckDB spill-to-disk chống OOM
          volumeMounts:
            - name: duckdb-scratch
              mountPath: /tmp/duckdb_scratch
              
      volumes:
        - name: duckdb-scratch
          emptyDir: {}
