# Template Secret chứa thông tin xác thực AWS S3 cho Nessie, ClickHouse, Ingestion và dbt
# Cách sử dụng:
#   1. cp 03-aws-secret.example.yaml 03-aws-secret.yaml
#   2. Điền AWS_ACCESS_KEY_ID và AWS_SECRET_ACCESS_KEY thực tế
#   3. kubectl apply -f infra/base/03-aws-secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: aws-credentials
  namespace: duckpipe
  labels:
    app.kubernetes.io/name: aws-credentials
    app.kubernetes.io/component: base
    app.kubernetes.io/part-of: duckpipe
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: "<CHANGE_ME_AWS_ACCESS_KEY_ID>"
  AWS_SECRET_ACCESS_KEY: "<CHANGE_ME_AWS_SECRET_ACCESS_KEY>"
