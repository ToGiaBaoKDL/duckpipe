apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: duckpipe
servers: 1
agents: 2
registries:
  create:
    name: k3d-duckpipe-registry
    host: "0.0.0.0"
    hostPort: "5001"
  config: |
    mirrors:
      "localhost:5001":
        endpoint:
          - "http://k3d-duckpipe-registry:5000"
options:
  k3d:
    wait: true
  k3s:
    nodeLabels:
      # Node agent-0: Chuyên chạy các dịch vụ phục vụ và catalog (Stateful / Serving)
      - label: workload=serving
        nodeFilters:
          - agent:0
      # Node agent-1: Chuyên chạy các batch jobs tính toán, nạp và biến đổi dữ liệu (Compute / Batch)
      - label: workload=batch
        nodeFilters:
          - agent:1
